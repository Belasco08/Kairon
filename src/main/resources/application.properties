# ===============================
# SERVER
# ===============================
server.port=8080
server.address=0.0.0.0

# ===============================
# APPLICATION
# ===============================
spring.application.name=kairon-backend


spring.datasource.url=jdbc:mysql://localhost:3306/kairon?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC



# ===============================
# FLYWAY
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ===============================
# SWAGGER / OPENAPI
# ===============================
springdoc.swagger-ui.path=/swagger
springdoc.api-docs.path=/v3/api-docs

# ===============================
# JWT CONFIG
# ===============================
jwt.secret=${JWT_SECRET:ZmFsc2U6NjU0MzIxMDA5ODc2NTQzMjEwMDk4NzY1NDMyMTAwOTg3}
jwt.refresh-secret=${JWT_REFRESH_SECRET:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ===============================
# DATE / TIME FORMAT (SPRING MVC)
# ===============================
spring.mvc.format.date=yyyy-MM-dd
spring.mvc.format.date-time=yyyy-MM-dd'T'HH:mm:ss
spring.mvc.format.time=HH:mm:ss


# Aumentar limite de upload de arquivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB