# ===============================
# SERVER
# ===============================
# O Render exige que a porta venha da variavel ${PORT}. Se nao tiver, usa 8080 (seu PC).
server.port=${PORT:8080}
server.address=0.0.0.0

# ===============================
# EMAIL CONFIG (GMAIL)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER:suportekairon@gmail.com}
spring.mail.password=${MAIL_PASS:coloque_aqui_para_teste_local}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# ===============================
# APPLICATION (CONEXaO INTELIGENTE)
# ===============================
spring.application.name=kairon-backend

# Se existir a variavel DATABASE_URL (Render), ele usa ela. Se nao (seu PC), usa o localhost do MySQL
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/kairon?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USER:root}
spring.datasource.password=${DATABASE_PASS:root}
spring.datasource.driver-class-name=${DATABASE_DRIVER:com.mysql.cj.jdbc.Driver}

spring.jpa.database-platform=${DATABASE_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC



